# Builds an unsigned SalesOS .ipa on a GitHub-hosted macOS runner.
#
# Why CI: an .ipa contains a compiled ARM64 Mach-O binary, and only Apple's
# toolchain can produce one, which only runs on macOS. This is how the file gets
# built without needing a Mac and Xcode locally.
#
# The .ipa is deliberately UNSIGNED. Sideloadly (and AltStore, and Xcode) re-sign
# with your own Apple ID at install time, so a signed build here would only be
# thrown away -- and signing would need certificates this workflow has no
# business holding.
name: Build iOS IPA

on:
  push:
    branches: [claude/ai-sales-crm-calling-bfnaqx]
    paths:
      - 'salesos/ios/**'
      - 'salesos/web/**'
      - 'salesos/package.json'
      - 'salesos/capacitor.config.json'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "available SDKs:"; xcodebuild -showsdks | grep -i ios || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: salesos
        run: npm install

      - name: Build the web client
        working-directory: salesos
        run: npm run build

      - name: Copy the web build into the iOS project
        working-directory: salesos
        run: npx cap sync ios

      - name: Build App.app (Release, unsigned, device arm64)
        working-directory: salesos/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tail -60

      - name: Package into an .ipa
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app was not produced at $APP"; exit 1; }

          # An .ipa is a zip whose single top-level directory is Payload/.
          WORK="$RUNNER_TEMP/pkg"
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/"
          ( cd "$WORK" && zip -qry "$RUNNER_TEMP/SalesOS.ipa" Payload )
          mv "$RUNNER_TEMP/SalesOS.ipa" ./SalesOS.ipa
          echo "path=SalesOS.ipa" >> "$GITHUB_OUTPUT"

      - name: Verify the .ipa is real
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          echo "size: $(du -h SalesOS.ipa | cut -f1)"
          echo
          echo "--- what is in the bundle ---"
          unzip -l SalesOS.ipa

          # A genuine arm64 iOS executable is the whole reason this runs on macOS.
          echo
          echo "--- executable ---"
          file "$APP/App"
          file "$APP/App" | grep -q "arm64" || { echo "FAIL: not an arm64 binary"; exit 1; }

          echo
          echo "--- identity ---"
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist"

          # Without this the app cannot reach a self-hosted server over plain
          # HTTP on a LAN address, and the failure on device is silent.
          echo
          echo "--- App Transport Security ---"
          plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$APP/Info.plist" \
            || { echo "FAIL: NSAllowsLocalNetworking missing -- a LAN server would be unreachable"; exit 1; }

          # The shell is useless without the web client. index.html alone is not
          # enough: it is the hashed JS bundle that actually boots the app, and a
          # bundle that failed to copy installs fine and then opens to a blank
          # white screen.
          echo
          echo "--- web client ---"
          test -f "$APP/public/index.html" || { echo "FAIL: public/index.html missing"; exit 1; }
          ls -la "$APP/public/assets/" || { echo "FAIL: public/assets/ missing"; exit 1; }

          JS=$(ls "$APP/public/assets/"*.js 2>/dev/null | head -1)
          CSS=$(ls "$APP/public/assets/"*.css 2>/dev/null | head -1)
          test -n "$JS" || { echo "FAIL: no JS bundle in the app"; exit 1; }
          test -n "$CSS" || { echo "FAIL: no stylesheet in the app"; exit 1; }

          JS_BYTES=$(stat -f%z "$JS")
          echo "JS bundle: $(basename "$JS") -- $JS_BYTES bytes"
          test "$JS_BYTES" -gt 300000 || { echo "FAIL: JS bundle is implausibly small"; exit 1; }

          # And that index.html actually points at the bundle that shipped.
          grep -q "$(basename "$JS")" "$APP/public/index.html" \
            || { echo "FAIL: index.html does not reference the bundled JS"; exit 1; }
          echo "index.html references the bundled JS"

          echo
          echo "All checks passed -- this .ipa contains a working app."

      - uses: actions/upload-artifact@v4
        with:
          name: SalesOS-unsigned-ipa
          path: SalesOS.ipa
          if-no-files-found: error
          retention-days: 30
