# Deploys SalesOS to Cloudflare Workers.
#
# Why CI: Cloudflare's API is unreachable from some development environments
# (an egress policy answering 403 to CONNECT on api.cloudflare.com, for
# instance), and a GitHub runner has unrestricted network access. It also means
# a deploy needs no local clone, no local toolchain and no local login.
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN   an "Edit Cloudflare Workers" token
#
# Optional repository secrets. Each is generated and stored on Cloudflare on the
# first run if absent, so they stay stable across deploys -- which matters:
# changing JWT_SECRET signs every session out, and changing ENCRYPTION_KEY makes
# stored recordings unreadable.
#   JWT_SECRET  ENCRYPTION_KEY  DEMO_PASSWORD  CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare

# The push trigger exists only to register this workflow. GitHub will not
# dispatch a workflow that lives outside the default branch unless something has
# registered it, and a dispatch-only file on a feature branch returns 404. The
# job itself refuses to run for a push, so pushing this file registers it and
# deploys nothing.
on:
  push:
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a public deployment'
        required: true
        default: ''

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse unless confirmed
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::This publishes a public URL. Re-run with confirm=deploy."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The workspace root carries vite; cloudflare/worker carries the bundle's
      # own dependencies. Both are needed and they are separate installs.
      - name: Install
        working-directory: salesos
        run: |
          npm install
          npm install --prefix cloudflare/worker

      - name: Lint and test
        working-directory: salesos
        run: npm test

      # Secrets live on Cloudflare, not in this workflow between runs, so only
      # the missing ones are written -- an existing deployment keeps its keys
      # and a redeploy signs nobody out.
      #
      # They go up as part of the deploy via --secrets-file rather than with
      # `wrangler secret put`, because that command cannot target a Worker that
      # does not exist yet: on a first run the secrets have to travel with the
      # upload, or the first version boots into a server that refuses to start
      # without them.
      - name: Work out which secrets are missing
        id: secrets
        working-directory: salesos/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          # An unknown Worker lists nothing, which is exactly the first-run case.
          npx wrangler secret list > existing.json 2>/dev/null || echo '[]' > existing.json
          node .github-deploy-secrets.cjs

      - name: Build the dashboard
        working-directory: salesos
        run: npm run build

      # wrangler deploy fails outright if a bound bucket does not exist, so the
      # first deploy after adding the binding has to create it. Creating one
      # that is already there is not an error worth failing a deploy over, but
      # anything else is: the message is matched rather than the exit code
      # being thrown away, so a permissions problem still stops the deploy.
      - name: Make sure the recordings bucket exists
        working-directory: salesos/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if npx wrangler r2 bucket create salesos-recordings 2>&1 | tee bucket.log; then
            echo "Created salesos-recordings."
          elif grep -qiE 'already exists|10004' bucket.log; then
            echo "salesos-recordings is already there."
          elif grep -qiE 'enable R2|code: 10042' bucket.log; then
            # Second failure mode, met right after the first: the token could
            # reach R2, but R2 had never been switched on for the account.
            echo "::error::R2 is not enabled on this Cloudflare account."
            {
              echo "## Deploy stopped: R2 is not enabled on the account"
              echo
              echo "The token can reach R2, but the account has never activated it."
              echo
              echo "Enable it once at <https://dash.cloudflare.com>:"
              echo "1. **Storage & databases → R2 Object Storage**"
              echo "2. Accept the enable prompt (a payment method may be required;"
              echo "   10 GB of storage a month is free and recordings fit inside it)"
              echo "3. Re-run this workflow \u2014 it creates the bucket itself"
              echo
              echo "Do not create the bucket by hand: the deploy names it"
              echo "\`salesos-recordings\` to match the Worker's binding."
            } >> "$GITHUB_STEP_SUMMARY"
            cat bucket.log
            exit 1
          elif grep -qiE 'Authentication error|code: 10000' bucket.log; then
            # The first time this ran, the deploy token had Workers permissions
            # but no R2 ones, and the only clue was "Authentication error
            # [code: 10000]" against an /r2/buckets URL. Name the remedy.
            echo "::error::The Cloudflare API token cannot manage R2."
            {
              echo "## Deploy stopped: the API token has no R2 permission"
              echo
              echo "Creating the \`salesos-recordings\` bucket returned an authentication error."
              echo "The token can deploy Workers but not manage R2 buckets."
              echo
              echo "Fix it at <https://dash.cloudflare.com/profile/api-tokens>:"
              echo "1. Edit the token behind the \`CLOUDFLARE_API_TOKEN\` secret"
              echo "2. Add **Account → Workers R2 Storage → Edit**"
              echo "3. Save, then re-run this workflow"
              echo
              echo "Editing a token keeps its value, so the GitHub secret does not need updating."
            } >> "$GITHUB_STEP_SUMMARY"
            cat bucket.log
            exit 1
          else
            echo "::error::Could not create the recordings bucket."
            cat bucket.log
            exit 1
          fi

      - name: Deploy
        id: deploy
        working-directory: salesos/cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRITE_SECRETS: ${{ steps.secrets.outputs.write_secrets }}
        run: |
          set -uo pipefail
          if [ "${WRITE_SECRETS:-no}" = "yes" ]; then
            npx wrangler deploy --secrets-file secrets.json 2>&1 | tee deploy.log
          else
            npx wrangler deploy 2>&1 | tee deploy.log
          fi
          status=${PIPESTATUS[0]}
          rm -f secrets.json
          [ "$status" -eq 0 ] || exit "$status"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PASSWORD: ${{ steps.secrets.outputs.generated_password }}
        run: |
          {
            echo "## SalesOS deployed"
            echo
            if [ -n "${URL:-}" ]; then echo "**$URL**"; else echo "See the deploy step for the URL."; fi
            echo
            echo "Sign in as \`admin@northstar.demo\`."
            if [ -n "${PASSWORD:-}" ]; then
              echo
              echo "Generated password: \`$PASSWORD\`"
              echo
              echo "This is the only place it is shown. Change it from Admin -> Users,"
              echo "because it now appears in this run's summary."
            else
              echo "The password is the DEMO_PASSWORD already stored on Cloudflare."
            fi
            echo
            echo "The demo organisation loads on the first request, and only into an"
            echo "empty database."
          } >> "$GITHUB_STEP_SUMMARY"
