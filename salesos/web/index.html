<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Two theme-colors so iOS tints the status bar to match the active theme
      rather than forcing a dark bar over a light UI. AppShell overwrites the
      active one when the user picks a theme explicitly, since a manual choice
      is not visible to prefers-color-scheme.
    -->
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e15" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SalesOS - the AI sales operating system. Every conversation becomes structured CRM data." />
    <title>SalesOS</title>
    <!-- Installable as a home-screen app. iOS reads apple-touch-icon and the
         apple-* meta tags rather than the manifest for the legacy paths, so both
         are declared. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SalesOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6df6'/%3E%3Cpath d='M9 21l5-10 4 6 2-3 3 7z' fill='white'/%3E%3C/svg%3E" />

    <!--
      Inter is a nice-to-have, not a dependency. Loading it as a blocking
      stylesheet would put a third-party CDN in the critical render path, so the
      whole app goes blank behind a restrictive corporate firewall or offline.
      Loading it with media="print" and swapping to "all" on load keeps it out of
      the render path: text paints immediately in the system font stack and
      upgrades to Inter if and when it arrives.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
