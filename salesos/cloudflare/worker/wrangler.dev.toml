# Local trial only: not production, and the demo seed switched on. The demo
# accounts share a published password, which is why both conditions exist.
name = "salesos-api-dev"
main = "src/index.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[alias]
"iconv-lite" = "../spike/src/iconv-stub.js"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
# Without this, this rule shadows wrangler's built-in ones and they are
# silently dropped.
fallthrough = true

# The dashboard is served by this same Worker, from the built client. Assets are
# matched first, `/api/*` and `/health` go to the Worker, and anything else
# falls back to index.html so a deep link like /admin/users renders instead of
# 404ing. Same origin as the API, which means no CORS to configure and no
# API base URL baked into the bundle at build time.
[assets]
directory = "../../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[durable_objects.bindings]]
name = "API"
class_name = "SalesOsApi"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalesOsApi"]

[vars]
NODE_ENV = "development"
TELEPHONY_PROVIDER = "simulator"
EMAIL_PROVIDER = "log"
AI_PROVIDER = "local"
STORAGE_DRIVER = "local"
QUEUE_ENABLED = "false"
SCHEDULER_ENABLED = "false"
SALESOS_ALLOW_DEMO_SEED = "true"
